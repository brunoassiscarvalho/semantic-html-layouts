<!DOCTYPE html>
<html lang="en">
  <head>
    <title>CSS Template</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        font-family: Arial, Helvetica, sans-serif;
        display: -webkit-flex;
        display: flex;
        flex-direction: column;
        align-items: stretch;
      }

      /* Style the header */
      header {
        background-color: #f1f1f1;
        padding: 30px;
        text-align: center;
        font-size: 35px;
      }

      /* Container for flexboxes */
      main {
        display: -webkit-flex;
        display: flex;
        align-items: stretch;
        height: max-content;
      }

      /* Create three unequal columns that sits next to each other */
      main > * {
        padding: 10px; /* Should be removed. Only for demonstration */
      }

      /* Left and right column */
      .column.side {
        -webkit-flex: 1;
        -ms-flex: 1;
        flex: 1;
      }

      /* Middle column */
      .column.middle {
        -webkit-flex: 2;
        -ms-flex: 2;
        flex: 2;
      }

      /* Style the footer */
      footer {
        background-color: #f1f1f1;
        padding: 10px;
        text-align: center;
      }

      /* Responsive layout - makes the three columns stack on top of each other instead of next to each other */
      @media (max-width: 600px) {
        main {
          -webkit-flex-direction: column;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h2>Header</h2>
    </header>
    <main>
      <div class="column side" style="background-color: #aaa">Column</div>
      <div class="column middle" style="background-color: #bbb">Column</div>
      <div class="column side" style="background-color: #ccc">Column</div>
    </main>
    <footer>
      <p>Footer</p>
    </footer>
  </body>
</html>
